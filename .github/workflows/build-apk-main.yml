name: Build FielTrace APK - native camera fix

on:
  workflow_dispatch:
  push:
    branches:
      - native-camera-gallery-fix

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native camera fix
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit source before APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('src/App.tsx').read_text(); cam=Path('src/services/cameraService.ts').read_text(); storage=Path('src/services/storageService.ts').read_text(); main=Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java').read_text() if Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java').exists() else ''; pkg=json.loads(Path('package.json').read_text())
          checks={'CameraPreview dependency':'@capgo/camera-preview' in pkg['dependencies'],'native camera':'CameraPreview.start' in app and 'CameraPreview.capture' in app,'zoom and flash':'CameraPreview.setZoom' in app and 'CameraPreview.setFlashMode' in app,'overlay and gallery':'cameraService.drawOverlay(rawImage, evidenceObject)' in app and 'cameraService.saveToGallery(finalImage, fileName)' in app,'Field Trace album':'Field Trace' in cam and 'Media.savePhoto' in cam,'no photo persistence':'La fotografía NO se persiste en IndexedDB' in storage,'native gallery bridge':'FieldTraceNative' in main}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('SOURCE AUDIT FAILED: '+', '.join(bad))
          print('SOURCE AUDIT PASSED')
          PY
      - name: Build web app
        run: npm run build
      - name: Ensure Capacitor Android platform
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then rm -rf android; npx cap add android; fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Restore native MainActivity bridge after sync
        run: |
          grep -q 'FieldTraceNative' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'resolveImageContentUri' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Final APK audit
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          git diff --check
          echo 'APK BUILD AND FINAL AUDIT PASSED'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-native-camera-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# APK build trigger: final verified source.
# This intentionally builds the debug APK only; no release signing is configured.
