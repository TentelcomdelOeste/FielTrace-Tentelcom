name: Native camera and gallery repair v5

on:
  push:
    branches:
      - native-camera-gallery-fix

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'native camera/gallery implementation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply native camera/gallery changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('src/App.tsx'); s=app.read_text()
          s=s.replace("import Webcam from 'react-webcam';", "import { CameraPreview } from '@capgo/camera-preview';")
          a=s.index('  const webcamRef = useRef<Webcam>(null);'); b=s.index('\n\n  useEffect(() => {\n    loadData();',a)
          block='''  const applyNativeZoom = async (level: number) => {\n    const next = Math.max(1, Math.min(8, Math.round(level * 10) / 10));\n    setCameraZoom(next);\n    try { await CameraPreview.setZoom({ level: next }); } catch (error) { console.warn('[Camera] zoom:', error); }\n  };\n  const cycleZoom = () => { const next = cameraZoom >= 3 ? 1 : cameraZoom >= 2 ? 3 : 2; void applyNativeZoom(next); };\n  const onCameraTouchStart = (e: TouchEvent) => { if (e.touches.length===2) { const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; pinchStartDist.current=Math.hypot(dx,dy); pinchStartZoom.current=cameraZoom; } };\n  const onCameraTouchMove = (e: TouchEvent) => { if (e.touches.length===2 && pinchStartDist.current) { const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; void applyNativeZoom(Math.max(1,Math.min(8,pinchStartZoom.current*(Math.hypot(dx,dy)/pinchStartDist.current)))); } };\n  const onCameraTouchEnd = () => { pinchStartDist.current=null; };\n  useEffect(() => {\n    if (currentStep !== 'camera') return;\n    let active=true;\n    (async () => { try {\n      await CameraPreview.start({ position:'rear', toBack:true, aspectMode:'cover', width:window.innerWidth, height:window.innerHeight, storeToFile:false, disableAudio:true, initialZoomLevel:1, rotateWhenOrientationChanged:true });\n      if (!active) return;\n      await CameraPreview.setFlashMode({ flashMode });\n      await CameraPreview.setZoom({ level: cameraZoom });\n    } catch (error) { console.error('[Camera] start:',error); } })();\n    return () => { active=false; void CameraPreview.stop({ force:true }).catch((error)=>console.warn('[Camera] stop:',error)); };\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [currentStep]);\n  useEffect(() => { if (currentStep !== 'camera') return; void CameraPreview.setFlashMode({ flashMode }).catch((error)=>console.warn('[Camera] flash:',error)); }, [flashMode,currentStep]);\n'''
          s=s[:a]+block+s[b:]
          c=s.index('  const captureBatchPhoto = async () => {'); a=s.index('      if (!webcamRef.current) {',c); b=s.index('\n\n      // Feedback visual rápido',a)
          s=s[:a]+'''      const captureResult = await CameraPreview.capture({ quality:90, format:'jpeg' });\n      const capturedValue = captureResult?.value;\n      const rawImage = capturedValue ? (capturedValue.startsWith('data:') ? capturedValue : `data:image/jpeg;base64,${capturedValue}`) : null;\n      if (!rawImage) throw new Error('No se pudo capturar la imagen con la cámara nativa');'''+s[b:]
          s,n=re.subn(r'\n\s*<Webcam[\s\S]*?/>','\n                  <div className="absolute inset-0 bg-transparent pointer-events-none" aria-hidden="true" />',s,count=1)
          if n!=1: raise SystemExit('Webcam JSX not found')
          s=s.replace('className="absolute inset-0 bg-black z-50 flex flex-col"','className="absolute inset-0 bg-transparent z-50 flex flex-col"',1)
          s=s.replace('className="relative flex-1 bg-gray-950 overflow-hidden"','className="relative flex-1 bg-transparent overflow-hidden" onTouchStart={onCameraTouchStart} onTouchMove={onCameraTouchMove} onTouchEnd={onCameraTouchEnd}',1)
          s,n=re.subn(r"const next = flashMode === 'off' \? 'on' : 'off';\s*setFlashMode\(next\);\s*await applyTorch\(next === 'on'\);", "const next = flashMode === 'off' ? 'on' : 'off'; setFlashMode(next); await CameraPreview.setFlashMode({ flashMode: next }).catch((error) => console.warn('[Camera] flash:', error));", s, count=1)
          if n!=1: raise SystemExit('Flash handler not found')
          s=s.replace("onClick={() => { setCameraZoom(1); setFlashMode('off'); void applyTorch(false); setCurrentStep('history'); }}","onClick={() => { setCameraZoom(1); setFlashMode('off'); setCurrentStep('history'); }}",1)
          s=s.replace('<div className="min-h-screen bg-white flex flex-col font-sans">','<div className={`min-h-screen ${currentStep === \'camera\' ? \'bg-transparent\' : \'bg-white\'} flex flex-col font-sans`}>',1)
          s=s.replace('<div className="flex-1 flex flex-col relative overflow-hidden">','<div className={`flex-1 flex flex-col relative overflow-hidden ${currentStep === \'camera\' ? \'invisible\' : \'\'}`}>',1)
          s=s.replace('''onClick={() => {\n                      if (lastImage) setShowLastImage(true);\n                      void cameraService.openFieldTraceAlbum();\n                    }}''','''onClick={() => {\n                      void cameraService.openFieldTraceAlbum(true);\n                    }}''',1)
          s=s.replace('''  useEffect(() => {\n    loadData();''','''  useEffect(() => {\n    document.documentElement.classList.toggle('native-camera-active', currentStep === 'camera');\n    return () => document.documentElement.classList.remove('native-camera-active');\n  }, [currentStep]);\n\n  useEffect(() => {\n    loadData();''',1)
          app.write_text(s)
          cam=Path('src/services/cameraService.ts'); cs=cam.read_text(); cs=cs.replace("import { Camera, CameraResultType, CameraSource } from '@capacitor/camera';\n",''); cs=re.sub(r'\n  async takePhoto\(\) \{[\s\S]*?\n  \},\n\n  async drawOverlay','\n  async drawOverlay',cs,count=1); cam.write_text(cs)
          css=Path('src/index.css'); xs=css.read_text();
          if 'html.native-camera-active' not in xs: xs+='\n\nhtml.native-camera-active, html.native-camera-active body, html.native-camera-active #root { background: transparent !important; }\n'
          css.write_text(xs)
          jp=Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java'); j=jp.read_text()
          if 'import android.provider.MediaStore;' not in j: j=j.replace('import android.net.Uri;','import android.net.Uri;\nimport android.content.ContentUris;\nimport android.database.Cursor;\nimport android.graphics.Color;\nimport android.provider.MediaStore;')
          if 'webView.setBackgroundColor(Color.TRANSPARENT);' not in j: j=j.replace('settings.setJavaScriptEnabled(true);','settings.setJavaScriptEnabled(true);\n                webView.setBackgroundColor(Color.TRANSPARENT);\n                webView.getRootView().setBackgroundColor(Color.TRANSPARENT);',1)
          j=j.replace('Uri uri = Uri.parse(uriString.trim());\n                  Intent intent = new Intent(Intent.ACTION_VIEW);','Uri uri = resolveImageContentUri(uriString.trim());\n                  Intent intent = new Intent(Intent.ACTION_VIEW);',1)
          if 'private Uri resolveImageContentUri' not in j:
            marker='    @JavascriptInterface\n    public void openGallery() {'
            helper='''    private Uri resolveImageContentUri(String uriString) {\n      Uri parsed=Uri.parse(uriString);\n      if ("content".equalsIgnoreCase(parsed.getScheme())) return parsed;\n      String path="file".equalsIgnoreCase(parsed.getScheme()) ? parsed.getPath() : uriString;\n      String[] projection={MediaStore.Images.Media._ID,MediaStore.Images.Media.DATA};\n      try (Cursor cursor=getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,projection,MediaStore.Images.Media.DATA+"=?",new String[]{path},null)) {\n        if(cursor!=null && cursor.moveToFirst()) { long id=cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID)); return ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,id); }\n      }\n      throw new IllegalArgumentException("Image not found in MediaStore: "+path);\n    }\n\n'''
            if marker not in j: raise SystemExit('openGallery marker not found')
            j=j.replace(marker,helper+marker,1)
          jp.write_text(j)
          print('Changes applied')
          PY
      - name: Source audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=Path('src/App.tsx').read_text(); c=Path('src/services/cameraService.ts').read_text(); j=Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java').read_text(); x=Path('src/index.css').read_text(); p=json.loads(Path('package.json').read_text())
          checks=[('@capgo/camera-preview' in p['dependencies']),("import Webcam from 'react-webcam';" not in a),('getScreenshot()' not in a),('CameraPreview.start' in a),('CameraPreview.capture' in a),('CameraPreview.setZoom' in a),('CameraPreview.setFlashMode' in a),('cameraService.drawOverlay(rawImage, evidenceObject)' in a),('cameraService.saveToGallery(finalImage, fileName)' in a),('Media.savePhoto' in c),('Field Trace' in c),('resolveImageContentUri' in j),('Intent.ACTION_VIEW' in j),('MediaStore.Images.Media' in j),('Color.TRANSPARENT' in j),('native-camera-active' in x),('openFieldTraceAlbum(true)' in a)]
          assert all(checks), 'SOURCE AUDIT FAILED'
          print('SOURCE AUDIT PASSED')
          PY
      - name: Compile audit only - no APK
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew compileDebugJavaWithJavac --no-daemon
      - name: Commit and remove all temporary repair workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml .github/workflows/native-camera-gallery-repair-v3.yml .github/workflows/native-camera-gallery-repair-v4.yml .github/workflows/native-camera-gallery-repair-v5.yml
          git add src/App.tsx src/services/cameraService.ts src/index.css android/app/src/main/java/com/fieldtrace/app/MainActivity.java package-lock.json .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml .github/workflows/native-camera-gallery-repair-v3.yml .github/workflows/native-camera-gallery-repair-v4.yml .github/workflows/native-camera-gallery-repair-v5.yml
          git diff --cached --check
          git commit -m "fix: native camera/gallery implementation"
          git push origin native-camera-gallery-fix
