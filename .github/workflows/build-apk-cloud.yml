name: Build FielTrace APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/build-apk-cloud

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Regenerate Capacitor Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Gradle wrapper
        working-directory: android
        run: |
          test -f gradlew
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
