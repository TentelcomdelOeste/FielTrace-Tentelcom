name: Restore App + Swipe viewer + Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-swipe-and-build.yml'
      - 'scripts/apply_swipe_viewer.py'

permissions:
  contents: write

jobs:
  restore-patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore App.tsx from known-good commit
        run: |
          set -euo pipefail
          GOOD_SHA="517d64e58149791a7f81dfa23b0e7583143b432d"
          echo "Restoring src/App.tsx from $GOOD_SHA"
          git show "$GOOD_SHA:src/App.tsx" > src/App.tsx
          lines=$(wc -l < src/App.tsx)
          echo "Restored lines=$lines"
          test "$lines" -gt 1000
          grep -q 'export default function App' src/App.tsx
          grep -q 'openGalleryGrid' src/App.tsx
          grep -q 'getLastThumbnail' src/App.tsx
          echo "RESTORE OK"

      - name: Apply in-app swipe viewer
        run: |
          set -euo pipefail
          python3 scripts/apply_swipe_viewer.py
          grep -q 'showPhotoViewer' src/App.tsx
          grep -q 'openPhotoViewer' src/App.tsx
          grep -q 'drag="x"' src/App.tsx
          grep -q 'ChevronLeft' src/App.tsx
          echo "SWIPE VIEWER OK"

      - name: Commit restored + patched App.tsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/apply_swipe_viewer.py
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(gallery): restore App.tsx + visor in-app con swipe entre fotos"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Ensure Capacitor Android platform
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore committed native files after sync
        run: |
          set -euo pipefail
          git checkout -- android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'FieldTraceNative' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'listFieldTracePhotos' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          git checkout -- android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          echo "NATIVE FILES RESTORED"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-swipe-viewer-debug-apk
          path: android/app/build/outputs/apk/debug/FieldTrace-debug.apk
          if-no-files-found: error
