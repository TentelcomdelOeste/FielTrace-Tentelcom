name: Build FielTrace APK (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # npm ci stops when package.json and package-lock.json are out of sync.
      # npm install resolves and refreshes the lockfile in the CI workspace so
      # a dependency update cannot prevent the APK build from starting.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      # The repository may contain only android/app (an incomplete native
      # platform). Generate the official Capacitor Android project when the
      # Gradle root/wrapper is missing. If it is already complete, preserve it.
      - name: Ensure complete Capacitor Android platform
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            echo "Incomplete Android platform detected; regenerating with Capacitor."
            rm -rf android
            npx cap add android
          else
            echo "Complete Android platform already present; preserving it."
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-main-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
