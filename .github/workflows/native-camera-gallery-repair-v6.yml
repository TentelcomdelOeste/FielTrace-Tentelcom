name: Native camera and gallery repair v6

on:
  push:
    branches:
      - native-camera-gallery-fix

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'native camera/gallery implementation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the tested source repair from v5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          workflow=Path('.github/workflows/native-camera-gallery-repair-v5.yml').read_text()
          m=re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not m: raise SystemExit('Could not extract v5 repair script')
          lines=[]
          for line in m.group(1).splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)
          subprocess.run(['python3','-c',script],check=True)
          PY
      - name: Source audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=Path('src/App.tsx').read_text(); c=Path('src/services/cameraService.ts').read_text(); j=Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java').read_text(); x=Path('src/index.css').read_text(); p=json.loads(Path('package.json').read_text())
          checks=[('@capgo/camera-preview' in p['dependencies']),("import Webcam from 'react-webcam';" not in a),('getScreenshot()' not in a),('CameraPreview.start' in a),('CameraPreview.capture' in a),('CameraPreview.setZoom' in a),('CameraPreview.setFlashMode' in a),('cameraService.drawOverlay(rawImage, evidenceObject)' in a),('cameraService.saveToGallery(finalImage, fileName)' in a),('Media.savePhoto' in c),('Field Trace' in c),('resolveImageContentUri' in j),('Intent.ACTION_VIEW' in j),('MediaStore.Images.Media' in j),('Color.TRANSPARENT' in j),('native-camera-active' in x),('openFieldTraceAlbum(true)' in a)]
          assert all(checks), 'SOURCE AUDIT FAILED'
          print('SOURCE AUDIT PASSED')
          PY
      - name: Web and native compile audit - no APK
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          if [ ! -f android/gradlew ]; then
            cp android/app/src/main/java/com/fieldtrace/app/MainActivity.java /tmp/MainActivity.java
            rm -rf android
            npx cap add android
            mkdir -p android/app/src/main/java/com/fieldtrace/app
            cp /tmp/MainActivity.java android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          fi
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew compileDebugJavaWithJavac --no-daemon
      - name: Final source audit after Capacitor sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          j=Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java').read_text()
          a=Path('src/App.tsx').read_text()
          assert 'resolveImageContentUri' in j and 'Intent.ACTION_VIEW' in j and 'MediaStore.Images.Media' in j
          assert '@capgo/camera-preview' in a and 'CameraPreview.capture' in a and 'CameraPreview.setZoom' in a and 'CameraPreview.setFlashMode' in a
          print('FINAL AUDIT PASSED')
          PY
      - name: Commit repaired branch and remove all temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml .github/workflows/native-camera-gallery-repair-v3.yml .github/workflows/native-camera-gallery-repair-v4.yml .github/workflows/native-camera-gallery-repair-v5.yml .github/workflows/native-camera-gallery-repair-v6.yml
          git add src/App.tsx src/services/cameraService.ts src/index.css android/app/src/main/java/com/fieldtrace/app/MainActivity.java package-lock.json .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml .github/workflows/native-camera-gallery-repair-v3.yml .github/workflows/native-camera-gallery-repair-v4.yml .github/workflows/native-camera-gallery-repair-v5.yml .github/workflows/native-camera-gallery-repair-v6.yml
          git diff --cached --check
          git commit -m "fix: native camera/gallery implementation"
          git push origin native-camera-gallery-fix
