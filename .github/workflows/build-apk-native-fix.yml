name: Build FielTrace APK - Native Fix

on:
  push:
    branches:
      - native-camera-gallery-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout native camera fix
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify native camera implementation
        run: |
          grep -q "@capgo/camera-preview" package.json
          grep -q "CameraPreview.start" src/App.tsx
          grep -q "CameraPreview.capture" src/App.tsx
          grep -q "CameraPreview.setZoom" src/App.tsx
          grep -q "CameraPreview.setFlashMode" src/App.tsx
          grep -q "cameraService.drawOverlay" src/App.tsx
          grep -q "cameraService.saveToGallery" src/App.tsx
          grep -q "Media.savePhoto" src/services/cameraService.ts
          grep -q "Field Trace" src/services/cameraService.ts
          echo "Native camera/gallery source verification passed"

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Verify native Android bridge
        run: |
          test -f android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q "FieldTraceNative" android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q "getDefaultVideoPoster" android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          echo "Native Android bridge verification passed"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-native-camera-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
