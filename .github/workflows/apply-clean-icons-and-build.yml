name: Apply clean launcher and splash icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-clean-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate clean visual resources only
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import urllib.request

          root = Path('.')
          blue = (0, 52, 153, 255)

          # Launcher: use the existing transparent foreground as the visual master.
          src_path = root / 'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png'
          src = Image.open(src_path).convert('RGBA')
          alpha = src.getchannel('A')
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit('Launcher foreground has no visible alpha content')
          src = src.crop(bbox)

          # Android adaptive icon canvas is 108dp; keep the artwork inside ~66dp safe area.
          ratio = 66 / 108
          def launcher_foreground(size):
              canvas = Image.new('RGBA', (size, size), (0,0,0,0))
              target = int(size * ratio)
              art = src.copy()
              art.thumbnail((target, target), Image.Resampling.LANCZOS)
              x = (size - art.width) // 2
              y = (size - art.height) // 2
              canvas.alpha_composite(art, (x, y))
              return canvas

          densities = {'mdpi':1, 'hdpi':1.5, 'xhdpi':2, 'xxhdpi':3, 'xxxhdpi':4}
          for density, scale in densities.items():
              size = round(108 * scale)
              out = root / f'android/app/src/main/res/mipmap-{density}/ic_launcher_foreground.png'
              launcher_foreground(size).save(out, optimize=True)

          # Legacy launcher icons: same artwork and safe visual scale on the existing blue background.
          def legacy(size):
              canvas = Image.new('RGBA', (size, size), blue)
              target = int(size * ratio)
              art = src.copy()
              art.thumbnail((target, target), Image.Resampling.LANCZOS)
              x = (size - art.width) // 2
              y = (size - art.height) // 2
              canvas.alpha_composite(art, (x, y))
              return canvas.convert('RGB')

          legacy_sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in legacy_sizes.items():
              outdir = root / f'android/app/src/main/res/mipmap-{density}'
              legacy(size).save(outdir / 'ic_launcher.png', optimize=True)
              legacy(size).save(outdir / 'ic_launcher_round.png', optimize=True)

          # Splash: 512px master, scaled to Android 12's ~2/3 visible icon circle.
          splash_src = root / 'public/android-chrome-512x512.png'
          if not splash_src.exists():
              splash_src = root / 'public/pwa-512x512.png'
          splash = Image.open(splash_src).convert('RGBA')
          splash_target = round(512 * (2/3))
          splash = splash.resize((splash_target, splash_target), Image.Resampling.LANCZOS)
          splash_canvas = Image.new('RGBA', (512, 512), (0,0,0,0))
          splash_canvas.alpha_composite(splash, ((512-splash_target)//2, (512-splash_target)//2))

          for density, size in {'mdpi':256,'hdpi':384,'xhdpi':512,'xxhdpi':768,'xxxhdpi':1024}.items():
              im = splash_canvas.resize((size, size), Image.Resampling.LANCZOS)
              (root / f'android/app/src/main/res/drawable-{density}/splash_icon.png').parent.mkdir(parents=True, exist_ok=True)
              im.save(root / f'android/app/src/main/res/drawable-{density}/splash_icon.png', optimize=True)
          splash_canvas.save(root / 'android/app/src/main/res/drawable/splash_icon.png', optimize=True)
          print('CLEAN ICON/SPLASH RESOURCES GENERATED')
          PY

      - name: Verify only launcher/splash PNGs changed
        run: |
          set -euo pipefail
          git status --short
          CHANGED=$(git status --short | awk '{print $2}')
          test -n "$CHANGED"
          BAD=0
          while IFS= read -r f; do
            case "$f" in
              android/app/src/main/res/drawable*/splash_icon.png|android/app/src/main/res/mipmap*/ic_launcher.png|android/app/src/main/res/mipmap*/ic_launcher_round.png|android/app/src/main/res/mipmap*/ic_launcher_foreground.png) ;;
              *) echo "UNEXPECTED CHANGE: $f"; BAD=1 ;;
            esac
          done <<< "$CHANGED"
          test "$BAD" -eq 0
          echo 'ONLY LAUNCHER/SPLASH PNGS CHANGED'

      - name: Commit clean images and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/res/drawable*/splash_icon.png android/app/src/main/res/mipmap*/ic_launcher.png android/app/src/main/res/mipmap*/ic_launcher_round.png android/app/src/main/res/mipmap*/ic_launcher_foreground.png
          git rm .github/workflows/apply-clean-icons-and-build.yml
          git commit -m 'fix: launcher and splash visual safe zones only'
          git push origin main
