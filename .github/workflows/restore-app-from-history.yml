name: Restore App.tsx from history

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-app-from-history.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore App.tsx from good commit
        run: |
          set -euo pipefail
          git show a465652e41031f7f47a4f7adc7789983752f7456:src/App.tsx > src/App.tsx
          wc -l src/App.tsx
          grep -q 'export default function App' src/App.tsx
          # Minimal safe patches
          sed -i 's/facingMode: { exact: "environment" }/facingMode: { ideal: "environment" }/g' src/App.tsx
          sed -i "s/SINCAL\.\.\./SIN GPS/g" src/App.tsx
          sed -i 's/width: { ideal: 4096 }/width: { ideal: 1920 }/g' src/App.tsx
          sed -i 's/height: { ideal: 2160 }/height: { ideal: 1080 }/g' src/App.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && echo 'No changes' && exit 0
          git commit -m "Restore App.tsx from good commit (autoplay facingMode + SIN GPS)"
          git push
