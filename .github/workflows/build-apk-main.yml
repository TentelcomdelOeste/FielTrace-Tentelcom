name: Build FielTrace APK (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify camera and gallery-only storage implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx').read_text()
          storage = Path('src/services/storageService.ts').read_text()
          cam = Path('src/services/cameraService.ts').read_text()

          required_app = [
              'const rawImage = webcamRef.current.getScreenshot();',
              'cameraService.drawOverlay(rawImage, evidenceObject)',
              'cameraService.saveToGallery(finalImage, fileName)',
          ]
          required_storage = [
              'La fotografía NO se persiste en IndexedDB',
              'firebaseService.syncEvidenceToCloud(evidenceToSave)',
          ]
          required_cam = [
              "Field Trace",
              'Media.savePhoto',
          ]

          missing = [x for x in required_app + required_storage + required_cam if x not in app + storage + cam]
          if missing:
              raise SystemExit('Camera/gallery implementation verification failed: ' + '; '.join(missing))

          print('Verified: camera capture -> overlay -> gallery Field Trace album')
          PY

      - name: Build web app
        run: npm run build

      - name: Ensure complete Capacitor Android platform
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            echo "Incomplete Android platform detected; regenerating with Capacitor."
            rm -rf android
            npx cap add android
          else
            echo "Complete Android platform already present; preserving it."
          fi

      - name: Inject MainActivity (disable mediaPlaybackRequiresUserGesture)
        shell: bash
        run: |
          set -euo pipefail
          # Find package path from capacitor appId
          DEST="android/app/src/main/java/com/fieldtrace/app/MainActivity.java"
          mkdir -p "$(dirname "$DEST")"
          if [ -f android/app/src/main/java/com/fieldtrace/app/MainActivity.java ]; then
            cp android/app/src/main/java/com/fieldtrace/app/MainActivity.java "$DEST"
          fi
          # Always write our fixed MainActivity (source of truth in repo)
          if [ -f android/app/src/main/java/com/fieldtrace/app/MainActivity.java ]; then
            echo "MainActivity already in tree"
          fi
          # Also search any generated default and replace
          cat > "$DEST" << 'JAVA'
          package com.fieldtrace.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                WebView webView = this.bridge.getWebView();
                if (webView != null) {
                  WebSettings settings = webView.getSettings();
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setDomStorageEnabled(true);
                  webView.setLayerType(WebView.LAYER_TYPE_HARDWARE, null);
                }
              } catch (Exception e) {}
            }

            @Override
            public void onStart() {
              super.onStart();
              try {
                WebView webView = this.bridge.getWebView();
                if (webView != null) {
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                }
              } catch (Exception ignored) {}
            }
          }
          JAVA
          # Fix leading spaces from heredoc if any
          sed -i 's/^          //' "$DEST" || true
          echo "--- MainActivity ---"
          head -20 "$DEST"
          # Remove any OTHER MainActivity.java that would conflict (wrong package)
          find android/app/src/main/java -name 'MainActivity.java' ! -path '*com/fieldtrace/app/*' -print -delete || true

      - name: Ensure Android runtime permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          required = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          marker = '</manifest>'
          missing = [x for x in required if x not in s]
          if missing:
              s = s.replace(marker, '\n    ' + '\n    '.join(missing) + '\n' + marker)
          if 'android:hardwareAccelerated="true"' not in s:
              s = s.replace('android:exported="true"', 'android:exported="true"\n            android:hardwareAccelerated="true"', 1)
          if 'android.hardware.camera' not in s:
              feat = (
                  '<!-- Permissions -->\n'
                  '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                  '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
              )
              if '<!-- Permissions -->' in s:
                  s = s.replace('<!-- Permissions -->', feat)
              else:
                  s = s.replace('<uses-permission', feat + '\n    <uses-permission', 1)
          p.write_text(s)
          print('Verified Android camera/location/media permissions and hardware acceleration')
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Re-apply MainActivity after cap sync
        shell: bash
        run: |
          DEST="android/app/src/main/java/com/fieldtrace/app/MainActivity.java"
          mkdir -p "$(dirname "$DEST")"
          cat > "$DEST" << 'JAVA'
          package com.fieldtrace.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                WebView webView = this.bridge.getWebView();
                if (webView != null) {
                  WebSettings settings = webView.getSettings();
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setDomStorageEnabled(true);
                  webView.setLayerType(WebView.LAYER_TYPE_HARDWARE, null);
                }
              } catch (Exception e) {}
            }

            @Override
            public void onStart() {
              super.onStart();
              try {
                WebView webView = this.bridge.getWebView();
                if (webView != null) {
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                }
              } catch (Exception ignored) {}
            }
          }
          JAVA
          sed -i 's/^          //' "$DEST" || true
          grep -q setMediaPlaybackRequiresUserGesture "$DEST"
          echo "MainActivity re-applied after cap sync"

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-main-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
