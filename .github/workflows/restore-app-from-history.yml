name: Restore App.tsx permanently

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-app-tsx.py'
      - '.github/workflows/restore-app-from-history.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure full App.tsx then patch
        run: |
          set -euo pipefail
          lines=$(wc -l < src/App.tsx || echo 0)
          if [ "$lines" -lt 500 ] || grep -q 'return null' src/App.tsx; then
            echo "App.tsx looks broken ($lines lines); restoring from good commit"
            git show a465652e41031f7f47a4f7adc7789983752f7456:src/App.tsx > src/App.tsx
          fi
          python3 scripts/patch-app-tsx.py
          lines=$(wc -l < src/App.tsx)
          echo "App.tsx lines=$lines"
          test "$lines" -gt 1000
          grep -q 'export default function App' src/App.tsx
          grep -q 'ideal: "environment"' src/App.tsx
          grep -q 'SIN GPS' src/App.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && echo 'No App changes' && exit 0
          git commit -m "Patch App.tsx: continuous forcePlay, evidence list from shutter, camera CSS class"
          git push
