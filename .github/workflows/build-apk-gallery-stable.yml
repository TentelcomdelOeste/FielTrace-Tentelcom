name: Build APK - Gallery URI + Camera Stable

on:
  push:
    branches:
      - fix/gallery-uri-camera-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Source verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          app = Path('src/App.tsx').read_text()
          cam_screen = Path('src/components/CameraScreen.tsx').read_text() if Path('src/components/CameraScreen.tsx').exists() else ''
          cam = Path('src/services/cameraService.ts').read_text()
          pkg = json.loads(Path('package.json').read_text())
          main = Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java')
          main_txt = main.read_text() if main.exists() else ''
          combined = app + cam_screen
          checks = {
            'CameraPreview dependency': '@capgo/camera-preview' in pkg.get('dependencies', {}),
            'native camera start': 'CameraPreview.start' in combined,
            'native capture': 'CameraPreview.capture' in combined,
            'native zoom': 'CameraPreview.setZoom' in combined,
            'native flash': 'CameraPreview.setFlashMode' in combined,
            'torch support': "'torch'" in cam_screen or 'torch' in cam_screen,
            'overlay': 'drawOverlay' in app or 'drawOverlay' in cam,
            'gallery save': 'saveToGallery' in app,
            'Field Trace album': 'Field Trace' in cam and 'Media.savePhoto' in cam,
            'rememberSaved path': 'rememberSaved' in cam or 'extractSavedPath' in cam,
            'native gallery bridge': 'FieldTraceNative' in main_txt,
            'openByFileName': 'openByFileName' in main_txt,
          }
          failed = [k for k, v in checks.items() if not v]
          if failed:
            raise SystemExit('SOURCE VERIFICATION FAILED: ' + ', '.join(failed))
          print('SOURCE VERIFICATION PASSED')
          for k, v in checks.items():
            print(f'  OK {k}')
          PY

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Restore MainActivity after cap sync if needed
        run: |
          # cap sync must not wipe our FieldTraceNative bridge
          if ! grep -q 'openByFileName' android/app/src/main/java/com/fieldtrace/app/MainActivity.java 2>/dev/null; then
            echo "MainActivity missing openByFileName after sync — checking out from branch"
            git checkout HEAD -- android/app/src/main/java/com/fieldtrace/app/MainActivity.java || true
          fi
          grep -q 'FieldTraceNative' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'openByFileName' android/app/src/main/java/com/fieldtrace/app/MainActivity.java || grep -q 'openUri' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          echo "Native bridge OK"

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Final APK audit
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK BUILD AND FINAL AUDIT PASSED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-gallery-uri-camera-stable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
