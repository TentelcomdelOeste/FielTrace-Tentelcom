name: Build FielTrace APK (cloud test)

on:
  push:
    branches:
      - test/build-apk-cloud

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Replace incomplete Android folder with generated Capacitor project
        run: |
          mv android android-legacy
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
