name: Build FielTrace APK - native camera fix

# Trigger build for the latest main application update.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit source before APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('src/App.tsx').read_text()
          cam=Path('src/services/cameraService.ts').read_text()
          storage=Path('src/services/storageService.ts').read_text()
          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text()
          pkg=json.loads(Path('package.json').read_text())
          checks={
            'CameraPreview dependency':'@capgo/camera-preview' in pkg['dependencies'],
            'Geolocation dependency':'@capacitor/geolocation' in pkg['dependencies'],
            'native camera start':'CameraPreview.start' in app,
            'native capture':'CameraPreview.capture' in app,
            'native zoom':'CameraPreview.setZoom' in app,
            'native flash':'CameraPreview.setFlashMode' in app,
            'overlay':'cameraService.drawOverlay(rawImage, evidenceObject)' in app,
            'gallery save':'cameraService.saveToGallery(finalImage, fileName)' in app,
            'Field Trace album':'Field Trace' in cam and 'Media.savePhoto' in cam,
            'no photo persistence':'La fotografía NO se persiste en IndexedDB' in storage,
            'manifest FINE location':'ACCESS_FINE_LOCATION' in manifest,
            'manifest COARSE location':'ACCESS_COARSE_LOCATION' in manifest,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('SOURCE AUDIT FAILED: '+', '.join(failed))
          print('SOURCE AUDIT PASSED')
          PY
      - name: Build web app
        run: npm run build
      - name: Ensure Capacitor Android platform
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install correct launcher images from public assets
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path('android/app/src/main/res')
          source = Path('public/pwa-512x512.png')

          if not source.is_file():
              raise SystemExit(f'Launcher source image not found: {source}')

          src = Image.open(source).convert('RGBA')
          if src.width != 512 or src.height != 512:
              raise SystemExit(f'Launcher source must be 512x512, got {src.size}')

          print(f'LAUNCHER SOURCE: {source} size={src.size}')

          # Android legacy/round launcher icons. These are the resources used
          # on devices that do not use adaptive icons.
          legacy_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, size in legacy_sizes.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  icon.save(d / name, 'PNG', optimize=True)

          # Android adaptive foreground resources. The same verified public
          # Field Trace image is used instead of extracting/reconstructing
          # pixels from the old native launcher asset.
          adaptive_sizes = {
              'mipmap-mdpi': 108,
              'mipmap-hdpi': 162,
              'mipmap-xhdpi': 216,
              'mipmap-xxhdpi': 324,
              'mipmap-xxxhdpi': 432,
          }

          for folder, size in adaptive_sizes.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              foreground = src.resize((size, size), Image.Resampling.LANCZOS)
              foreground.save(d / 'ic_launcher_foreground.png', 'PNG', optimize=True)

          # Adaptive icon background remains a solid white layer. The actual
          # launcher artwork comes exclusively from the verified public image.
          bg = res / 'values' / 'ic_launcher_background.xml'
          bg.parent.mkdir(parents=True, exist_ok=True)
          xml = chr(10).join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<resources>',
              '    <color name="ic_launcher_background">#FFFFFF</color>',
              '</resources>',
              ''
          ])
          bg.write_bytes(xml.encode('utf-8'))

          print('LAUNCHER ICONS INSTALLED FROM public/pwa-512x512.png')
          PY

      - name: Restore committed native files after sync (MainActivity + AndroidManifest)
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          git checkout -- android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'FieldTraceNative' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'getDefaultVideoPoster' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          echo "NATIVE MAINACTIVITY RESTORED"
          git checkout -- android/app/src/main/AndroidManifest.xml
          echo "=== AndroidManifest after restore ==="
          cat android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_COARSE_LOCATION android/app/src/main/AndroidManifest.xml
          echo "AndroidManifest location permissions confirmed after sync"
      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK to FieldTrace.apk
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/debug"
          ls -la "$OUT" || true
          # Prefer already-named file; otherwise take the newest *.apk and rename
          if [ -f "$OUT/FieldTrace.apk" ]; then
            echo "Already FieldTrace.apk"
          else
            SRC=$(ls -1t "$OUT"/*.apk 2>/dev/null | head -1 || true)
            if [ -z "$SRC" ]; then
              echo "No APK found in $OUT"
              find android/app/build/outputs -name '*.apk' -print || true
              exit 1
            fi
            echo "Renaming $SRC -> $OUT/FieldTrace.apk"
            mv "$SRC" "$OUT/FieldTrace.apk"
          fi
          test -s "$OUT/FieldTrace.apk"
          ls -lh "$OUT/FieldTrace.apk"
      - name: Verify APK launcher icon is clean
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/FieldTrace.apk"
          TMP=$(mktemp -d)
          unzip -q -o "$APK" 'res/mipmap-xxxhdpi-v4/ic_launcher.png' 'res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png' -d "$TMP"
          python3 -m pip install --disable-pip-version-check Pillow numpy
          python3 - <<'PY' "$TMP"
          from pathlib import Path
          from PIL import Image
          import numpy as np
          import sys
          root=Path(sys.argv[1])
          fg=np.array(Image.open(root/'res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png').convert('RGBA'))
          rgb=fg[:,:,:3].astype(np.float32)/255.0
          mx=rgb.max(2); mn=rgb.min(2)
          sat=np.divide(mx-mn,mx,out=np.zeros_like(mx),where=mx!=0)
          visible=fg[:,:,3]>8
          blue=visible & (sat>=0.30) & (rgb[:,:,2]>rgb[:,:,0]*1.15)
          neutral=visible & (sat<0.20)
          if blue.sum() < 5000 or neutral.sum() > 2000:
              raise SystemExit(f'LAUNCHER ICON AUDIT FAILED: blue={blue.sum()} neutral={neutral.sum()}')
          icon=np.array(Image.open(root/'res/mipmap-xxxhdpi-v4/ic_launcher.png').convert('RGBA'))
          rgb2=icon[:,:,:3].astype(np.float32)/255.0
          mx2=rgb2.max(2); mn2=rgb2.min(2)
          sat2=np.divide(mx2-mn2,mx2,out=np.zeros_like(mx2),where=mx2!=0)
          colored=(icon[:,:,3]>8) & (sat2>=0.20)
          blue2=colored & (rgb2[:,:,2]>rgb2[:,:,0]*1.15)
          if blue2.sum() < 1500:
              raise SystemExit(f'FALLBACK ICON AUDIT FAILED: blue={blue2.sum()}')
          print(f'LAUNCHER ICON AUDIT PASSED: adaptive_blue={blue.sum()} adaptive_neutral={neutral.sum()} fallback_blue={blue2.sum()}')
          PY

      - name: Validate APK location permissions (aapt)
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/FieldTrace.apk"
          test -s "$APK"
          AAPT=$(ls "${ANDROID_HOME}/build-tools"/*/aapt 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            AAPT=$(ls "${ANDROID_SDK_ROOT}/build-tools"/*/aapt 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using aapt: $AAPT"
          echo "=== aapt dump permissions ==="
          "$AAPT" dump permissions "$APK" || true
          echo "=== aapt dump badging (uses-permission lines) ==="
          "$AAPT" dump badging "$APK" | grep -i permission || true
          PERMS=$("$AAPT" dump permissions "$APK" 2>/dev/null || true)
          echo "$PERMS" | grep -q "ACCESS_FINE_LOCATION" || {
            echo "FAIL: ACCESS_FINE_LOCATION missing from final APK (aapt)"
            TMP=$(mktemp -d)
            unzip -q -o "$APK" AndroidManifest.xml -d "$TMP" || true
            echo "strings sample:"; strings "$TMP/AndroidManifest.xml" 2>/dev/null | grep -i LOCATION || true
            find android -name "AndroidManifest.xml" 2>/dev/null | head -20
            exit 1
          }
          echo "$PERMS" | grep -q "ACCESS_COARSE_LOCATION" || {
            echo "FAIL: ACCESS_COARSE_LOCATION missing from final APK (aapt)"
            exit 1
          }
          echo "PASS: location permissions present in final APK"
          ls -lh "$APK"
      - name: Final APK audit
        run: |
          test -s android/app/build/outputs/apk/debug/FieldTrace.apk
          echo "APK BUILD AND FINAL AUDIT PASSED"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldTrace-apk
          path: android/app/build/outputs/apk/debug/FieldTrace.apk
          if-no-files-found: error
