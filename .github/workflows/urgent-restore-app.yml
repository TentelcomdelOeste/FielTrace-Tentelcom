name: Urgent restore App.tsx

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/urgent-restore-app.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App.tsx from ec296376
        run: |
          git show ec296376:src/App.tsx > src/App.tsx
          wc -l src/App.tsx
          grep -q forcePlay src/App.tsx
          grep -q Webcam src/App.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Restore App.tsx from ec296376 (camera working baseline)" || echo "nothing"
          git push
