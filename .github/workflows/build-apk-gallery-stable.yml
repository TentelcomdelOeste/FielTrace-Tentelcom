name: Build APK - Gallery URI + Camera Stable

on:
  push:
    branches:
      - fix/gallery-uri-camera-stable
      - fix/camera-gps-gallery-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify native CameraX zero-shutter-lag patch
        run: |
          grep -q 'CAPTURE_MODE_ZERO_SHUTTER_LAG' node_modules/@capgo/camera-preview/android/src/main/java/app/capgo/capacitor/camera/preview/CameraXView.java
          ! grep -q 'CAPTURE_MODE_MINIMIZE_LATENCY' node_modules/@capgo/camera-preview/android/src/main/java/app/capgo/capacitor/camera/preview/CameraXView.java
          echo "NATIVE CAMERA X ZSL PATCH VERIFIED"

      - name: Source verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          app = Path('src/App.tsx').read_text()
          cam_screen = Path('src/components/CameraScreen.tsx').read_text() if Path('src/components/CameraScreen.tsx').exists() else ''
          cam = Path('src/services/cameraService.ts').read_text()
          loc = Path('src/services/locationService.ts').read_text()
          pkg = json.loads(Path('package.json').read_text())
          main = Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java')
          main_txt = main.read_text() if main.exists() else ''
          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text() if Path('android/app/src/main/AndroidManifest.xml').exists() else ''
          paths = Path('android/app/src/main/res/xml/file_paths.xml')
          checks = {
            'App.tsx is real source': 'export default function App' in app and 'RESTORING_FROM_LOCAL' not in app and len(app) > 5000,
            'camera hidden class': "currentStep === 'camera' ? 'hidden'" in app,
            'Campos Operativos modal': 'Campos Operativos' in app and 'showQuickConfig' in app,
            'camera dependency': '@capgo/camera-preview' in pkg.get('dependencies', {}),
            'camera start': 'CameraPreview.start' in cam_screen,
            'camera permissions': 'CameraPreview.requestPermissions' in cam_screen,
            'GPS permissions': 'locationService.checkAndRequestPermissions' in cam_screen,
            'camera full-screen fill': "aspectRatio: 'fill'" in cam_screen and "setAspectRatio({ aspectRatio: 'fill'" in cam_screen,
            'no forced screen dimensions': 'width: window.innerWidth' not in cam_screen and 'height: window.innerHeight' not in cam_screen,
            'native capture': 'CameraPreview.capture' in app,
            'capture speed priority': "photoQualityPrioritization:'speed'" in app,
            'native zoom': 'CameraPreview.setZoom' in cam_screen,
            'native flash': 'CameraPreview.setFlashMode' in cam_screen,
            'gear drag control': 'handleGearPointerMove' in cam_screen,
            'camera error retry': 'cameraError' in cam_screen and 'Reintentar cámara' in cam_screen,
            'gallery save': 'saveToGallery' in app and 'Media.savePhoto' in cam,
            'Field Trace album': 'Field Trace' in cam,
            'native gallery bridge': 'FieldTraceNative' in main_txt,
            'native media scanner': 'MediaScannerConnection.scanFile' in main_txt,
            'FileProvider fallback': 'FileProvider.getUriForFile' in main_txt,
            'preferred Google Photos': 'com.google.android.apps.photos' in main_txt,
            'no raw ACTION_VIEW file path': 'ACTION_VIEW' in main_txt and 'Uri.parse(uriString.trim())' not in main_txt,
            'GPS resilient fallback': 'trying network fix' in loc and 'getCurrentPosition' in loc,
            'GPS watcher': 'Geolocation.watchPosition' in loc,
            'location permissions manifest': 'ACCESS_FINE_LOCATION' in manifest and 'ACCESS_COARSE_LOCATION' in manifest,
            'FileProvider manifest': 'androidx.core.content.FileProvider' in manifest and '${applicationId}.fileprovider' in manifest,
            'FileProvider paths': paths.exists() and 'external-media-path' in paths.read_text(),
          }
          failed = [k for k, v in checks.items() if not v]
          if failed:
            raise SystemExit('SOURCE VERIFICATION FAILED: ' + ', '.join(failed))
          print('SOURCE VERIFICATION PASSED')
          PY

      - name: TypeScript lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Restore custom Android files after cap sync
        run: |
          git checkout HEAD -- android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          git checkout HEAD -- android/app/src/main/AndroidManifest.xml
          git checkout HEAD -- android/app/src/main/res/xml/file_paths.xml
          test -f android/app/src/main/res/xml/file_paths.xml
          grep -q 'FieldTraceNative' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'FileProvider' android/app/src/main/AndroidManifest.xml
          grep -q 'external-media-path' android/app/src/main/res/xml/file_paths.xml
          echo "Custom Android files restored and verified"

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Final APK audit
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK BUILD AND FINAL AUDIT PASSED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-gallery-uri-camera-stable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
