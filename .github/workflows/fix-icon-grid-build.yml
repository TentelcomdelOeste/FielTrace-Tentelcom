name: Fix launcher and splash grid, then build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-icons-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate clean visual resources only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, sys
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'Pillow'])
          from PIL import Image, ImageDraw

          ROOT = Path('.')
          RES = ROOT / 'android/app/src/main/res'
          candidates = [
              ROOT/'public/pwa-512x512.png',
              ROOT/'public/android-chrome-512x512.png',
              ROOT/'public/pwa-192x192.png',
          ]
          src = next((p for p in candidates if p.exists()), None)
          if src is None:
              raise SystemExit('No public icon source found')

          im = Image.open(src).convert('RGB')
          w, h = im.size
          if w != h:
              raise SystemExit(f'Expected square source, got {im.size}')

          # Remove the gray construction/grid lines by extracting only the
          # saturated blue logo. Gray/white pixels have essentially zero blue
          # excess and therefore become transparent.
          pix = im.load()
          scores = []
          for y in range(h):
              for x in range(w):
                  r, g, b = pix[x, y]
                  scores.append(max(0, b - max(r, g)))
          strong = [v for v in scores if v >= 35]
          if not strong:
              raise SystemExit('Could not detect blue logo in source image')
          strong_sorted = sorted(strong)
          blue_excess_ref = strong_sorted[len(strong_sorted)//2]

          alpha = Image.new('L', (w, h), 0)
          ap = alpha.load()
          for y in range(h):
              for x in range(w):
                  r, g, b = pix[x, y]
                  excess = b - max(r, g)
                  # Keep strong logo pixels opaque and retain antialiased edges.
                  a = int(max(0, min(255, (excess - 8) * 255 / max(1, blue_excess_ref - 8))))
                  ap[x, y] = a

          bbox = alpha.getbbox()
          if bbox is None:
              raise SystemExit('Logo alpha bbox is empty')
          logo = Image.new('RGBA', (bbox[2]-bbox[0], bbox[3]-bbox[1]), (0,0,0,0))
          crop_a = alpha.crop(bbox)
          # Use a representative source blue so the clean logo retains the original branding tone.
          strong_rgb = []
          for y in range(bbox[1], bbox[3]):
              for x in range(bbox[0], bbox[2]):
                  r, g, b = pix[x, y]
                  if b - max(r, g) >= 45:
                      strong_rgb.append((r,g,b))
          if not strong_rgb:
              raise SystemExit('Could not sample logo blue')
          sr = sorted(v[0] for v in strong_rgb)[len(strong_rgb)//2]
          sg = sorted(v[1] for v in strong_rgb)[len(strong_rgb)//2]
          sb = sorted(v[2] for v in strong_rgb)[len(strong_rgb)//2]
          logo.paste((sr, sg, sb, 255), (0,0,logo.width,logo.height), crop_a)

          def clean_icon(size, logo_ratio):
              canvas = Image.new('RGBA', (size, size), (255,255,255,255))
              target = max(1, int(size * logo_ratio))
              scale = target / max(logo.width, logo.height)
              nw = max(1, int(round(logo.width * scale)))
              nh = max(1, int(round(logo.height * scale)))
              lg = logo.resize((nw, nh), Image.Resampling.LANCZOS)
              x = (size-nw)//2
              y = (size-nh)//2
              canvas.alpha_composite(lg, (x,y))
              return canvas

          # Legacy launcher: clean white tile with the same visual logo scale.
          legacy_sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder, size in legacy_sizes.items():
              d = RES/folder; d.mkdir(parents=True, exist_ok=True)
              out = clean_icon(size, 0.62).convert('RGB')
              out.save(d/'ic_launcher.png', 'PNG')
              out.save(d/'ic_launcher_round.png', 'PNG')

          # Adaptive foreground is deliberately self-contained: white tile + blue logo.
          # This avoids relying on the previous blue background XML, which would conflict with the blue mark.
          adaptive_sizes = {'mipmap-mdpi':108,'mipmap-hdpi':162,'mipmap-xhdpi':216,'mipmap-xxhdpi':324,'mipmap-xxxhdpi':432}
          for folder, size in adaptive_sizes.items():
              d = RES/folder
              clean_icon(size, 0.62).save(d/'ic_launcher_foreground.png', 'PNG')

          # Android 12+ splash icon: clean white tile + blue logo, no grid.
          splash_sizes = {'drawable':288,'drawable-mdpi':144,'drawable-hdpi':216,'drawable-xhdpi':288,'drawable-xxhdpi':432,'drawable-xxxhdpi':576}
          for folder, size in splash_sizes.items():
              d = RES/folder; d.mkdir(parents=True, exist_ok=True)
              clean_icon(size, 0.62).save(d/'splash_icon.png', 'PNG')

          print('SOURCE:', src)
          print('LOGO BBOX:', bbox, 'sampled blue:', (sr,sg,sb))
          print('Generated launcher/splash PNGs only')
          PY

      - name: Verify only launcher/splash PNGs changed
        run: |
          set -euo pipefail
          ALLOWED='android/app/src/main/res/drawable-hdpi/splash_icon.png
          android/app/src/main/res/drawable-mdpi/splash_icon.png
          android/app/src/main/res/drawable-xhdpi/splash_icon.png
          android/app/src/main/res/drawable-xxhdpi/splash_icon.png
          android/app/src/main/res/drawable-xxxhdpi/splash_icon.png
          android/app/src/main/res/drawable/splash_icon.png
          android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png'
          git status --short
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' "$ALLOWED" | sed '/^$/d' | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          echo 'IMAGE-ONLY RESOURCE AUDIT PASSED'

      - name: Commit clean images and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/res/drawable*/splash_icon.png android/app/src/main/res/mipmap-*/*.png
          git rm .github/workflows/fix-icon-grid-build.yml
          git commit -m 'fix: clean launcher and splash graphics only'
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore protected native files after sync
        run: |
          git checkout -- android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          git checkout -- android/app/src/main/AndroidManifest.xml
          grep -q 'FieldTraceNative' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and audit APK
        run: |
          set -euo pipefail
          OUT='android/app/build/outputs/apk/debug'
          SRC=$(ls -1t "$OUT"/*.apk | head -1)
          mv "$SRC" "$OUT/FieldTrace.apk"
          test -s "$OUT/FieldTrace.apk"
          AAPT=$(ls "${ANDROID_HOME}/build-tools"/*/aapt | sort -V | tail -1)
          "$AAPT" dump permissions "$OUT/FieldTrace.apk" | grep -q ACCESS_FINE_LOCATION
          "$AAPT" dump permissions "$OUT/FieldTrace.apk" | grep -q ACCESS_COARSE_LOCATION
          echo 'APK AUDIT PASSED'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldTrace-apk-clean-icons
          path: android/app/build/outputs/apk/debug/FieldTrace.apk
          if-no-files-found: error
