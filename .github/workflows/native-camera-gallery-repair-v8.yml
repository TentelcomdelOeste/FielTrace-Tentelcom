name: Native camera and gallery repair v8

on:
  push:
    branches:
      - native-camera-gallery-fix

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'native camera/gallery implementation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply tested source repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          workflow=Path('.github/workflows/native-camera-gallery-repair-v5.yml').read_text()
          m=re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not m: raise SystemExit('Could not extract tested repair script')
          lines=[line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines()]
          subprocess.run(['python3','-c','\n'.join(lines)],check=True)
          PY
      - name: Full source audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=Path('src/App.tsx').read_text(); c=Path('src/services/cameraService.ts').read_text(); j=Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java').read_text(); x=Path('src/index.css').read_text(); p=json.loads(Path('package.json').read_text())
          checks={
            'plugin dependency':'@capgo/camera-preview' in p['dependencies'],
            'no WebView camera':"import Webcam from 'react-webcam';" not in a and 'getScreenshot()' not in a,
            'native camera lifecycle':'CameraPreview.start' in a and 'CameraPreview.stop' in a,
            'native capture':'CameraPreview.capture' in a,
            'hardware zoom':'CameraPreview.setZoom' in a,
            'hardware flash':'CameraPreview.setFlashMode' in a,
            'overlay retained':'cameraService.drawOverlay(rawImage, evidenceObject)' in a,
            'gallery retained':'cameraService.saveToGallery(finalImage, fileName)' in a,
            'Field Trace album':'Media.savePhoto' in c and 'Field Trace' in c,
            'real MediaStore URI':'resolveImageContentUri' in j and 'MediaStore.Images.Media' in j,
            'system viewer':'Intent.ACTION_VIEW' in j and 'image/*' in j,
            'transparent native preview layer':'Color.TRANSPARENT' in j and 'native-camera-active' in x,
            'last photo opens album':'openFieldTraceAlbum(true)' in a,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('AUDIT FAILED: '+', '.join(bad))
          print('FULL SOURCE AUDIT PASSED')
          for k in checks: print('PASS:',k)
          PY
      - name: Web build and Capacitor sync audit - NO APK
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          npx cap sync android
          test -f android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'resolveImageContentUri' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'CameraPreview' src/App.tsx
      - name: Final audit
        run: |
          git diff --check
          echo 'FINAL AUDIT PASSED - no APK task executed'
      - name: Commit repaired branch and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml .github/workflows/native-camera-gallery-repair-v3.yml .github/workflows/native-camera-gallery-repair-v4.yml .github/workflows/native-camera-gallery-repair-v5.yml .github/workflows/native-camera-gallery-repair-v6.yml .github/workflows/native-camera-gallery-repair-v7.yml .github/workflows/native-camera-gallery-repair-v8.yml
          git add src/App.tsx src/services/cameraService.ts src/index.css android/app/src/main/java/com/fieldtrace/app/MainActivity.java package-lock.json .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml .github/workflows/native-camera-gallery-repair-v3.yml .github/workflows/native-camera-gallery-repair-v4.yml .github/workflows/native-camera-gallery-repair-v5.yml .github/workflows/native-camera-gallery-repair-v6.yml .github/workflows/native-camera-gallery-repair-v7.yml .github/workflows/native-camera-gallery-repair-v8.yml
          git diff --cached --check
          git commit -m "fix: native camera/gallery implementation"
          git push origin native-camera-gallery-fix
