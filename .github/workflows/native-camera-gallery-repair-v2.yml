name: Native camera and gallery repair v2

on:
  push:
    branches:
      - native-camera-gallery-fix

permissions:
  contents: write

jobs:
  repair-and-audit:
    if: "!contains(github.event.head_commit.message, 'native camera/gallery implementation')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply native camera/gallery implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          s = app.read_text()
          if "import Webcam from 'react-webcam';" not in s:
              raise SystemExit('Expected current WebView camera source not found')
          s = s.replace("import Webcam from 'react-webcam';", "import { CameraPreview } from '@capgo/camera-preview';")

          start = s.index('  const webcamRef = useRef<Webcam>(null);')
          end = s.index('\n\n  useEffect(() => {\n    loadData();', start)
          native_block = '''  const applyNativeZoom = async (level: number) => {\n    const next = Math.max(1, Math.min(8, Math.round(level * 10) / 10));\n    setCameraZoom(next);\n    try {\n      await CameraPreview.setZoom({ level: next });\n    } catch (error) {\n      console.warn('[Camera] Native zoom rejected:', error);\n    }\n  };\n\n  const cycleZoom = () => {\n    const next = cameraZoom >= 3 ? 1 : cameraZoom >= 2 ? 3 : 2;\n    void applyNativeZoom(next);\n  };\n\n  const onCameraTouchStart = (e: React.TouchEvent) => {\n    if (e.touches.length === 2) {\n      const dx = e.touches[0].clientX - e.touches[1].clientX;\n      const dy = e.touches[0].clientY - e.touches[1].clientY;\n      pinchStartDist.current = Math.hypot(dx, dy);\n      pinchStartZoom.current = cameraZoom;\n    }\n  };\n\n  const onCameraTouchMove = (e: React.TouchEvent) => {\n    if (e.touches.length === 2 && pinchStartDist.current) {\n      const dx = e.touches[0].clientX - e.touches[1].clientX;\n      const dy = e.touches[0].clientY - e.touches[1].clientY;\n      const dist = Math.hypot(dx, dy);\n      const scale = dist / pinchStartDist.current;\n      void applyNativeZoom(Math.max(1, Math.min(8, pinchStartZoom.current * scale)));\n    }\n  };\n\n  const onCameraTouchEnd = () => {\n    pinchStartDist.current = null;\n  };\n\n  useEffect(() => {\n    if (currentStep !== 'camera') return;\n    let active = true;\n    const startCamera = async () => {\n      try {\n        await CameraPreview.start({\n          position: 'rear',\n          toBack: true,\n          aspectMode: 'cover',\n          width: window.innerWidth,\n          height: window.innerHeight,\n          storeToFile: false,\n          disableAudio: true,\n          initialZoomLevel: 1,\n          rotateWhenOrientationChanged: true,\n        });\n        if (!active) return;\n        await CameraPreview.setFlashMode({ flashMode });\n        await CameraPreview.setZoom({ level: cameraZoom });\n      } catch (error) {\n        console.error('[Camera] Native preview failed to start:', error);\n      }\n    };\n    void startCamera();\n    return () => {\n      active = false;\n      void CameraPreview.stop({ force: true }).catch((error) => console.warn('[Camera] stop:', error));\n    };\n    // Lifecycle only; flash/zoom have separate effects/handlers.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [currentStep]);\n\n  useEffect(() => {\n    if (currentStep !== 'camera') return;\n    void CameraPreview.setFlashMode({ flashMode }).catch((error) => console.warn('[Camera] flash:', error));\n  }, [flashMode, currentStep]);\n'''
          s = s[:start] + native_block + s[end:]

          cap = s.index('  const captureBatchPhoto = async () => {')
          raw_start = s.index('      if (!webcamRef.current) {', cap)
          raw_end = s.index('\n\n      // Feedback visual rápido', raw_start)
          capture_block = '''      const captureResult = await CameraPreview.capture({ quality: 90, format: 'jpeg' });\n      const capturedValue = captureResult?.value;\n      const rawImage = capturedValue\n        ? (capturedValue.startsWith('data:') ? capturedValue : `data:image/jpeg;base64,${capturedValue}`)\n        : null;\n      if (!rawImage) throw new Error('No se pudo capturar la imagen con la cámara nativa');'''
          s = s[:raw_start] + capture_block + s[raw_end:]

          # Replace the old WebView camera element with a transparent touch surface.\n          s, n = re.subn(r'\n\s*<Webcam[\s\S]*?/>' , '\n                  <div className="absolute inset-0 bg-transparent pointer-events-none" aria-hidden="true" />', s, count=1)
          if n != 1:
              raise SystemExit('Expected Webcam JSX element not found')

          s = s.replace('className="absolute inset-0 bg-black z-50 flex flex-col"', 'className="absolute inset-0 bg-transparent z-50 flex flex-col"', 1)
          s = s.replace('className="relative flex-1 bg-gray-950 overflow-hidden"', 'className="relative flex-1 bg-transparent overflow-hidden" onTouchStart={onCameraTouchStart} onTouchMove={onCameraTouchMove} onTouchEnd={onCameraTouchEnd}', 1)

          old_flash = '''const next = flashMode === 'off' ? 'on' : 'off';\n                        setFlashMode(next);\n                        await applyTorch(next === 'on');'''
          if old_flash not in s:
              raise SystemExit('Expected old flash handler not found')
          s = s.replace(old_flash, '''const next = flashMode === 'off' ? 'on' : 'off';\n                        setFlashMode(next);\n                        await CameraPreview.setFlashMode({ flashMode: next }).catch((error) => console.warn('[Camera] flash:', error));''', 1)

          s = s.replace("onClick={() => { setCameraZoom(1); setFlashMode('off'); void applyTorch(false); setCurrentStep('history'); }}", "onClick={() => { setCameraZoom(1); setFlashMode('off'); setCurrentStep('history'); }}", 1)
          s = s.replace('<div className="min-h-screen bg-white flex flex-col font-sans">', '<div className={`min-h-screen ${currentStep === \'camera\' ? \'bg-transparent\' : \'bg-white\'} flex flex-col font-sans`}>', 1)
          s = s.replace('<div className="flex-1 flex flex-col relative overflow-hidden">', '<div className={`flex-1 flex flex-col relative overflow-hidden ${currentStep === \'camera\' ? \'invisible\' : \'\'}`}>', 1)
          s = s.replace('''onClick={() => {\n                      if (lastImage) setShowLastImage(true);\n                      void cameraService.openFieldTraceAlbum();\n                    }}''', '''onClick={() => {\n                      void cameraService.openFieldTraceAlbum(true);\n                    }}''', 1)
          s = s.replace('''  useEffect(() => {\n    loadData();''', '''  useEffect(() => {\n    document.documentElement.classList.toggle('native-camera-active', currentStep === 'camera');\n    return () => document.documentElement.classList.remove('native-camera-active');\n  }, [currentStep]);\n\n  useEffect(() => {\n    loadData();''', 1)
          app.write_text(s)

          cam = Path('src/services/cameraService.ts')
          cs = cam.read_text()
          cs = cs.replace("import { Camera, CameraResultType, CameraSource } from '@capacitor/camera';\n", '')
          cs = re.sub(r'\n  async takePhoto\(\) \{[\s\S]*?\n  \},\n\n  async drawOverlay', '\n  async drawOverlay', cs, count=1)
          cam.write_text(cs)

          css = Path('src/index.css')
          xs = css.read_text()
          if 'html.native-camera-active' not in xs:
              xs += '''\n\n/* Native camera preview is behind the WebView only while the camera screen is active. */\nhtml.native-camera-active,\nhtml.native-camera-active body,\nhtml.native-camera-active #root {\n  background: transparent !important;\n}\n'''
          css.write_text(xs)

          java_path = Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java')
          java = java_path.read_text()
          java = java.replace('import android.net.Uri;\n', 'import android.net.Uri;\nimport android.content.ContentUris;\nimport android.database.Cursor;\nimport android.graphics.Color;\nimport android.provider.MediaStore;\n')
          java = java.replace('settings.setJavaScriptEnabled(true);\n', 'settings.setJavaScriptEnabled(true);\n                webView.setBackgroundColor(Color.TRANSPARENT);\n                webView.getRootView().setBackgroundColor(Color.TRANSPARENT);\n', 1)
          old = '''                Uri uri = Uri.parse(uriString.trim());\n                Intent intent = new Intent(Intent.ACTION_VIEW);\n                intent.setDataAndType(uri, "image/*");\n                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n                intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);\n                startActivity(intent);'''
          if old not in java:
              raise SystemExit('Expected FieldTraceNative.openUri body not found')
          java = java.replace(old, '''                Uri uri = resolveImageContentUri(uriString.trim());\n                Intent intent = new Intent(Intent.ACTION_VIEW);\n                intent.setDataAndType(uri, "image/*");\n                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n                intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);\n                startActivity(intent);''', 1)
          marker = '    @JavascriptInterface\n    public void openGallery() {'
          helper = '''    private Uri resolveImageContentUri(String uriString) {\n      Uri parsed = Uri.parse(uriString);\n      if ("content".equalsIgnoreCase(parsed.getScheme())) return parsed;\n      String path = "file".equalsIgnoreCase(parsed.getScheme()) ? parsed.getPath() : uriString;\n      if (path == null || path.trim().isEmpty()) throw new IllegalArgumentException("Empty image path");\n      String[] projection = { MediaStore.Images.Media._ID, MediaStore.Images.Media.DATA };\n      try (Cursor cursor = getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, projection, MediaStore.Images.Media.DATA + "=?", new String[] { path }, null)) {\n        if (cursor != null && cursor.moveToFirst()) {\n          long id = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID));\n          return ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);\n        }\n      }\n      throw new IllegalArgumentException("Image not found in MediaStore: " + path);\n    }\n\n'''
          if marker not in java:
              raise SystemExit('openGallery marker not found')
          java = java.replace(marker, helper + marker, 1)
          java_path.write_text(java)

          print('Native camera/gallery implementation applied')
          PY

      - name: Audit source before native sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('src/App.tsx').read_text(); cam=Path('src/services/cameraService.ts').read_text(); java=Path('android/app/src/main/java/com/fieldtrace/app/MainActivity.java').read_text(); css=Path('src/index.css').read_text(); pkg=json.loads(Path('package.json').read_text())
          checks={
            'plugin dependency':'@capgo/camera-preview' in pkg['dependencies'],
            'no react-webcam import':"import Webcam from 'react-webcam';" not in app,
            'no getScreenshot':'getScreenshot()' not in app,
            'native start':'CameraPreview.start' in app,
            'native capture':'CameraPreview.capture' in app,
            'native zoom':'CameraPreview.setZoom' in app,
            'native flash':'CameraPreview.setFlashMode' in app,
            'overlay preserved':'cameraService.drawOverlay(rawImage, evidenceObject)' in app,
            'gallery save preserved':'cameraService.saveToGallery(finalImage, fileName)' in app,
            'Field Trace album':'Media.savePhoto' in cam and 'Field Trace' in cam,
            'content URI bridge':'resolveImageContentUri' in java and 'MediaStore.Images.Media' in java,
            'system viewer':'Intent.ACTION_VIEW' in java and 'image/*' in java,
            'transparent WebView':'Color.TRANSPARENT' in java,
            'camera CSS':'native-camera-active' in css,
            'last-photo opens native album':'openFieldTraceAlbum(true)' in app,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('SOURCE AUDIT FAILED: '+', '.join(failed))
          print('SOURCE AUDIT PASSED')
          PY

      - name: Install and sync Capacitor (no APK)
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: TypeScript and web build audit (no APK)
        run: |
          npm run lint
          npm run build

      - name: Native Android compile audit (no APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew compileDebugJavaWithJavac --no-daemon

      - name: Commit repaired branch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml
          git add src/App.tsx src/services/cameraService.ts src/index.css android/app/src/main/java/com/fieldtrace/app/MainActivity.java package-lock.json .github/workflows/native-camera-gallery-repair.yml .github/workflows/native-camera-gallery-repair-v2.yml
          git diff --cached --check
          git commit -m "fix: native camera/gallery implementation"
          git push origin native-camera-gallery-fix
