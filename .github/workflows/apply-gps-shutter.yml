name: Apply GPS-off + non-blocking shutter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App.tsx and apply GPS+shutter patch
        run: |
          set -euo pipefail
          git show d5a1666d92c1d20943cd764ce80c0744fe64a2ef:src/App.tsx > src/App.tsx
          test "$(wc -c < src/App.tsx)" -gt 50000
          grep -q captureBatchPhoto src/App.tsx
          echo '' | base64 -d > /tmp/fix.patch
          patch -p1 < /tmp/fix.patch
          grep -q 'Liberar obturador INMEDIATAMENTE' src/App.tsx
          grep -q 'Prioridad: si el GPS' src/App.tsx
          echo "PATCH OK lines=$(wc -l < src/App.tsx)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix(gps+shutter): SIN GPS when location off; unlock shutter immediately after capture"
          git push origin main
