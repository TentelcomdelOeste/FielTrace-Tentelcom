name: Build FielTrace APK (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore integrated camera and gallery-only storage
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          s = app.read_text()
          s = s.replace("import { Capacitor } from '@capacitor/core';\n", '')

          old = '''      let rawImage: string | null = null;\n      const isNative = Capacitor.isNativePlatform();\n\n      if (isNative) {\n        rawImage = await cameraService.takePhoto();\n      } else {\n        if (!webcamRef.current) {\n          setIsProcessing(false);\n          return;\n        }\n        rawImage = webcamRef.current.getScreenshot();\n      }'''
          new = '''      if (!webcamRef.current) {\n        setIsProcessing(false);\n        return;\n      }\n\n      const rawImage = webcamRef.current.getScreenshot();'''
          if old not in s:
              raise SystemExit('Expected native capture block was not found')
          s = s.replace(old, new, 1)

          start = '                  {Capacitor.isNativePlatform() ? ('
          end = '                  )}\n                  \n                  {/* Flash Feedback Layer */}'
          i = s.find(start)
          if i < 0:
              raise SystemExit('Expected native camera UI block was not found')
          j = s.find(end, i)
          if j < 0:
              raise SystemExit('Expected native camera UI block end was not found')

          webcam = '''                  <Webcam\n                    audio={false}\n                    ref={webcamRef}\n                    screenshotFormat="image/jpeg"\n                    videoConstraints={{\n                      facingMode: { exact: "environment" },\n                      width: { ideal: 4096 },\n                      height: { ideal: 2160 }\n                    }}\n                    className="w-full h-full object-cover"\n                    mirrored={false}\n                    forceScreenshotSourceSize={true}\n                    imageSmoothing={true}\n                    disablePictureInPicture={true}\n                    screenshotQuality={0.92}\n                    onUserMedia={() => console.log('Camera ready')}\n                    onUserMediaError={(err) => console.error('Camera error', err)}\n                  />\n'''
          s = s[:i] + webcam + s[j + len('                  )}\n'):]
          app.write_text(s)

          storage = Path('src/services/storageService.ts')
          t = storage.read_text()
          t = t.replace("import { Capacitor } from '@capacitor/core';\n", '')
          pattern = re.compile(r"\n\s*// En navegador web \(preview sin galería nativa\).*?\n\s*}\n\n\s*// Intentar sincronizar con Firebase", re.S)
          replacement = "\n\n    // La fotografía NO se persiste en IndexedDB; se conserva únicamente en la galería del dispositivo.\n    // La evidencia almacenada aquí contiene solo metadatos para historial y sincronización.\n\n    // Intentar sincronizar con Firebase"
          t, count = pattern.subn(replacement, t, count=1)
          if count != 1:
              raise SystemExit('Expected web photo-storage block was not found')
          storage.write_text(t)

      - name: Configure native camera preview flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.tsx')
          s = p.read_text()
          pattern = r"\n\s*if \(Capacitor\.isNativePlatform\(\) && selectedProject\) \{\n\s*captureBatchPhoto\(\)\.finally\(\(\) => \{\n\s*setCurrentStep\('history'\);\n\s*\}\);\n\s*\}"
          s, count = re.subn(pattern, '', s, count=1)
          if count not in (0, 1):
              raise SystemExit('Unexpected number of legacy automatic capture blocks')
          p.write_text(s)
          PY

      - name: Build web app
        run: npm run build

      - name: Ensure complete Capacitor Android platform
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            echo "Incomplete Android platform detected; regenerating with Capacitor."
            rm -rf android
            npx cap add android
          else
            echo "Complete Android platform already present; preserving it."
          fi

      - name: Ensure Android runtime permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          required = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          marker = '</manifest>'
          missing = [x for x in required if x not in s]
          if missing:
              s = s.replace(marker, '\n    ' + '\n    '.join(missing) + '\n' + marker)
              p.write_text(s)
          print('Verified Android camera/location permissions in manifest')
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-main-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
