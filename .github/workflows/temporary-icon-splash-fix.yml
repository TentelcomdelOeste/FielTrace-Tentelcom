name: Temporary icon + splash visual fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/temporary_icon_splash_fix.py'
      - '.github/workflows/temporary-icon-splash-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: pip install -q Pillow
      - name: Generate launcher and splash resources only
        run: |
          set -euo pipefail
          python3 scripts/temporary_icon_splash_fix.py
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -f android/app/src/main/res/drawable-xxxhdpi/splash_icon.png
      - name: Commit image resources only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          git add android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          git add android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          git add android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          git add android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          git add android/app/src/main/res/drawable/splash_icon.png android/app/src/main/res/drawable-mdpi/splash_icon.png android/app/src/main/res/drawable-hdpi/splash_icon.png android/app/src/main/res/drawable-xhdpi/splash_icon.png android/app/src/main/res/drawable-xxhdpi/splash_icon.png android/app/src/main/res/drawable-xxxhdpi/splash_icon.png
          if git diff --staged --quiet; then echo 'NO IMAGE CHANGES'; exit 1; fi
          git diff --staged --name-only
          git commit -m 'fix: launcher and splash visual safe zones only'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Capacitor sync
        run: npx cap sync android
      - name: Restore committed native files after sync
        run: |
          git checkout -- android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          git checkout -- android/app/src/main/AndroidManifest.xml
      - name: Reapply image resources after sync
        run: python3 scripts/temporary_icon_splash_fix.py
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare APK
        run: |
          set -euo pipefail
          OUT='android/app/build/outputs/apk/debug'
          SRC=$(ls -1t "$OUT"/*.apk | head -1)
          cp "$SRC" "$OUT/FieldTrace.apk"
          test -s "$OUT/FieldTrace.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FieldTrace-apk-icon-splash-fix
          path: android/app/build/outputs/apk/debug/FieldTrace.apk
          if-no-files-found: error
      - name: Final audit and remove temporary tooling
        run: |
          set -euo pipefail
          echo '=== FINAL DIFF AGAINST PRE-FIX PARENT ==='
          git diff --name-only HEAD^ HEAD
          echo '=== PROTECTED FILES UNCHANGED IN IMAGE COMMIT ==='
          git diff --quiet HEAD^ HEAD -- src/App.tsx android/app/src/main/java/com/fieldtrace/app/MainActivity.java android/app/src/main/AndroidManifest.xml || { echo 'PROTECTED FILE CHANGED'; exit 1; }
          echo 'PROTECTED FILES PASS'
          git rm scripts/temporary_icon_splash_fix.py .github/workflows/temporary-icon-splash-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary icon fix tooling'
          git push
