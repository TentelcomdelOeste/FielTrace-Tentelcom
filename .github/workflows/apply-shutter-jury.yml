name: Apply non-blocking shutter for jury buttons
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore App.tsx and apply non-blocking shutter + GPS-off
        run: |
          set -e
          git show d5a1666d92c1d20943cd764ce80c0744fe64a2ef:src/App.tsx > src/App.tsx
          wc -c src/App.tsx
          python3 scripts/fix_shutter_gps.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git status
          git commit -m "fix(shutter+gps): non-blocking jury/shutter - release isProcessing immediately after capture; SIN GPS when GPS off" || echo "nothing to commit"
          git push origin main
