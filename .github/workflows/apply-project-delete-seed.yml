name: Project delete + demo seed (no APK)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-project-delete-seed.yml'
      - 'scripts/apply_project_delete_seed.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/apply_project_delete_seed.py
          grep -q 'PROYECTO DEMO' src/App.tsx
          grep -q 'projectSelectMode' src/App.tsx
          grep -q 'requestDeleteProjects' src/App.tsx
          grep -q 'confirmDeleteProjectsStep' src/App.tsx
          grep -q 'async deleteProject' src/services/storageService.ts
          grep -q 'async deleteProjects' src/services/storageService.ts
          echo "PATCH OK"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/storageService.ts scripts/apply_project_delete_seed.py
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: eliminar proyectos (multi + doble confirm) y seed demo en primera instalación"
            git push
          fi
