name: Fix camera UX gallery zoom flash

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-camera-ux.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore cameraService and patch App + MainActivity
        run: |
          set -euo pipefail
          # Restore good cameraService with Media.savePhoto
          git show 0df32da:src/services/cameraService.ts > src/services/cameraService.ts
          grep -q 'Media.savePhoto' src/services/cameraService.ts

          python3 << 'PY'
          from pathlib import Path

          # --- cameraService: improve openFieldTraceAlbum ---
          cam = Path('src/services/cameraService.ts').read_text()
          if 'FieldTraceNative' not in cam:
              old = '''  async openFieldTraceAlbum(): Promise<void> {
    try {
      if (Capacitor.getPlatform() === 'android') {
        const intents = [
          'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_GALLERY;end',
          'intent:#Intent;action=android.intent.action.VIEW;type=image/*;end',
          'content://media/external/images/media'
        ];
        for (const url of intents) {
          try { window.location.href = url; return; } catch (_) {}
        }
        window.open('content://media/external/images/media', '_system');
      } else {
        window.open('photos://', '_blank');
      }
    } catch (e) {
      console.warn('[Gallery] open failed', e);
    }
  },
'''
              new = '''  async openFieldTraceAlbum(): Promise<boolean> {
    try {
      const native = (window as any).FieldTraceNative;
      if (native && typeof native.openGallery === 'function') {
        try { native.openGallery(); return true; } catch (e) { console.warn('[Gallery] FieldTraceNative failed', e); }
      }
      try {
        const CapApp = (window as any).Capacitor?.Plugins?.App;
        if (CapApp?.openUrl) {
          await CapApp.openUrl({ url: 'content://media/external/images/media' });
          return true;
        }
      } catch (e) { console.warn('[Gallery] Cap App.openUrl failed', e); }
      if (Capacitor.getPlatform() === 'android') {
        const intents = [
          'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_GALLERY;end',
          'intent:#Intent;action=android.intent.action.VIEW;type=image/*;end',
          'intent://media/external/images/media#Intent;scheme=content;action=android.intent.action.VIEW;type=image/*;end',
        ];
        for (const url of intents) {
          try {
            const a = document.createElement('a');
            a.href = url; a.target = '_system'; a.rel = 'noopener';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            return true;
          } catch (_) {}
        }
        try { window.open('content://media/external/images/media', '_system'); return true; } catch (_) {}
      } else {
        window.open('photos://', '_blank');
        return true;
      }
    } catch (e) { console.warn('[Gallery] open failed', e); }
    return false;
  },
'''
              if old not in cam:
                  raise SystemExit('openFieldTraceAlbum block missing')
