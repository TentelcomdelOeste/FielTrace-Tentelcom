name: Apply camera gallery fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply camera gallery repair') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply repair
        run: python3 scripts/fix_camera_gallery.py

      - name: Verify changes
        run: |
          grep -q "ensureFieldTraceAlbum" src/services/cameraService.ts
          grep -q "albumIdentifier" src/services/cameraService.ts
          grep -q "onLoadedMetadata" src/App.tsx
          grep -q "controls={false}" src/App.tsx
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/cameraService.ts src/App.tsx
          git commit -m "Apply camera gallery repair"
          git push

      - name: Remove one-time repair files
        if: success()
        run: |
          git rm .github/workflows/apply-camera-gallery-fix.yml scripts/fix_camera_gallery.py
          git commit -m "Remove one-time camera repair files"
          git push
