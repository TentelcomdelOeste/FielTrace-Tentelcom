name: Fix native camera preview layout

on:
  workflow_dispatch:

jobs:
  fix-camera:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: native-camera-gallery-fix
          fetch-depth: 0

      - name: Patch camera lifecycle and WebView visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          old = """  useEffect(() => {\n    if (currentStep !== 'camera') return;\n    let active=true;\n    (async () => { try {\n      await CameraPreview.start({ position:'rear', toBack:true, aspectMode:'cover', width:window.innerWidth, height:window.innerHeight, storeToFile:false, disableAudio:true, initialZoomLevel:1, rotateWhenOrientationChanged:true });\n      if (!active) return;\n      await CameraPreview.setFlashMode({ flashMode });\n      await CameraPreview.setZoom({ level: cameraZoom });\n    } catch (error) { console.error('[Camera] start:',error); } })();\n    return () => { active=false; void CameraPreview.stop({ force:true }).catch((error)=>console.warn('[Camera] stop:',error)); };\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [currentStep]);"""

          new = """  useEffect(() => {\n    if (currentStep !== 'camera') return;\n    let active = true;\n    (async () => {\n      try {\n        const permission = await CameraPreview.requestPermissions({ disableAudio: true });\n        if (permission.camera !== 'granted') {\n          throw new Error(`Permiso de cámara no concedido: ${permission.camera}`);\n        }\n\n        await CameraPreview.start({\n          position: 'rear',\n          toBack: true,\n          aspectMode: 'cover',\n          width: window.screen.width,\n          height: window.screen.height,\n          x: 0,\n          y: 0,\n          storeToFile: false,\n          disableAudio: true,\n          initialZoomLevel: 1,\n          rotateWhenOrientationChanged: true\n        });\n\n        if (!active) return;\n\n        // Force the native preview to occupy the complete Android viewport.\n        // Some devices otherwise clamp the preview to the camera's 4:3 surface,\n        // leaving the lower part of the screen uncovered.\n        await CameraPreview.setPreviewSize({\n          x: 0,\n          y: 0,\n          width: window.screen.width,\n          height: window.screen.height\n        });\n        await CameraPreview.setFlashMode({ flashMode });\n        await CameraPreview.setZoom({ level: cameraZoom });\n      } catch (error) {\n        console.error('[Camera] start:', error);\n      }\n    })();\n\n    return () => {\n      active = false;\n      void CameraPreview.stop({ force: true }).catch((error) => console.warn('[Camera] stop:', error));\n    };\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [currentStep]);"""

          if old not in s:
              raise SystemExit('Camera lifecycle block not found; refusing to modify the file')
          s = s.replace(old, new, 1)

          old_visibility = """      <div className={`flex-1 flex flex-col relative overflow-hidden ${currentStep === 'camera' ? 'invisible' : ''}`}>"""
          new_visibility = """      <div className="flex-1 flex flex-col relative overflow-hidden">"""
          if old_visibility not in s:
              raise SystemExit('Camera visibility block not found; refusing to modify the file')
          s = s.replace(old_visibility, new_visibility, 1)

          p.write_text(s)
          PY

      - name: Verify source changes
        run: |
          grep -n "requestPermissions" src/App.tsx
          grep -n "setPreviewSize" src/App.tsx
          grep -n "flex-1 flex flex-col relative overflow-hidden" src/App.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: restore native camera UI and fill preview" || echo "No changes to commit"
          git push origin native-camera-gallery-fix

      - name: Remove temporary repair workflow
        if: always()
        run: |
          git rm .github/workflows/fix-camera-preview-layout.yml || true
          git commit -m "chore: remove temporary camera repair workflow" || true
          git push origin native-camera-gallery-fix || true
