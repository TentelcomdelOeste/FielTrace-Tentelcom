name: Build FielTrace APK (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify camera and gallery-only storage implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx').read_text()
          storage = Path('src/services/storageService.ts').read_text()

          required_app = [
              'const rawImage = webcamRef.current.getScreenshot();',
              'cameraService.drawOverlay(rawImage, evidenceObject)',
              'cameraService.saveToGallery(finalImage, fileName)',
          ]
          required_storage = [
              'La fotografía NO se persiste en IndexedDB',
              'firebaseService.syncEvidenceToCloud(evidenceToSave)',
          ]

          missing = [x for x in required_app + required_storage if x not in app + storage]
          if missing:
              raise SystemExit('Camera/gallery implementation verification failed: ' + '; '.join(missing))

          if 'localStorage.setItem' in app and 'photo' in app.lower():
              print('Note: no photo persistence was detected through localStorage.')

          print('Verified: camera capture -> overlay -> gallery, with evidence metadata stored separately.')
          PY

      - name: Build web app
        run: npm run build

      - name: Ensure complete Capacitor Android platform
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            echo "Incomplete Android platform detected; regenerating with Capacitor."
            rm -rf android
            npx cap add android
          else
            echo "Complete Android platform already present; preserving it."
          fi

      - name: Ensure Android runtime permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          required = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
          ]
          marker = '</manifest>'
          missing = [x for x in required if x not in s]
          if missing:
              s = s.replace(marker, '\n    ' + '\n    '.join(missing) + '\n' + marker)
          if 'android:hardwareAccelerated="true"' not in s:
              s = s.replace('android:exported="true"', 'android:exported="true"\n            android:hardwareAccelerated="true"', 1)
          if 'android.hardware.camera' not in s:
              feat = (
                  '<!-- Permissions -->\n'
                  '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                  '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
              )
              s = s.replace('<!-- Permissions -->', feat)
          p.write_text(s)
          print('Verified Android camera/location/media permissions and hardware acceleration')
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: FielTrace-main-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
