name: Assemble locationService
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        run: |
          set -euo pipefail
          cat .restore/locationService.part0 .restore/locationService.part1 .restore/locationService.part2 > src/services/locationService.ts
          wc -c src/services/locationService.ts
          ! grep -q SEE_LOCAL_FILE src/services/locationService.ts
          grep -q PERMISSION_NOT_DECLARED src/services/locationService.ts
          grep -q OS-PLUG-GLOC-0018 src/services/locationService.ts
          grep -q locationHistoryBuffer src/services/locationService.ts
          echo ASSEMBLE_OK
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/locationService.ts
          git commit -m "fix(gps): restore full locationService.ts from assembled parts"
          git push origin HEAD:main
